name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "POST /pages status $code"
          cat /tmp/pages.json
          echo
      - name: Unpack game
        run: |
          cat game/payload/0.b64.00 game/payload/0.b64.01 game/payload/0.b64.02 game/payload/0.b64.03 game/payload/0.b64.04 game/payload/0.b64.05 \
              game/payload/1.b64.00 game/payload/1.b64.01 game/payload/1.b64.02 game/payload/1.b64.03 game/payload/1.b64.04 game/payload/1.b64.05 \
              game/payload/2.b64.00 game/payload/2.b64.01 game/payload/2.b64.02 game/payload/2.b64.03 game/payload/2.b64.04 game/payload/2.b64.05 \
              game/payload/3.b64.00 game/payload/3.b64.01 game/payload/3.b64.02 game/payload/3.b64.03 game/payload/3.b64.04 game/payload/3.b64.05 \
            | base64 -d | gunzip > game/index.html
          echo "e11eeb3772523c14a111dcd8a161e44354d16b2e5b62812d5d821c3c0ed81176  game/index.html" | sha256sum -c
          rm -rf game/payload
      - name: Vendor Three.js r160.1
        run: |
          mkdir -p game/vendor
          curl -fsSL -o game/vendor/three.min.js https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js
          test -s game/vendor/three.min.js
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
